<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今日の目標を管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#fafaf9;color:#1a1a18;padding:calc(20px + env(safe-area-inset-top)) 16px 48px;min-height:100vh}
.app{max-width:660px;margin:0 auto}
.top-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.nav-title{font-size:15px;font-weight:500}
.nav-link{font-size:12px;color:#7F77DD;text-decoration:none}
.txt-inp{width:100%;padding:10px 12px;font-size:14px;font-family:inherit;border:1px solid #e8e8e5;border-radius:10px;background:#fff;color:#1a1a18;outline:none;transition:border-color .15s;box-sizing:border-box}
.txt-inp:focus{border-color:#7F77DD}
.btn-add{width:100%;padding:10px 18px;font-size:13px;font-weight:600;color:#fff;background:#7F77DD;border:none;border-radius:10px;cursor:pointer}
.btn-add:active{background:#534AB7}
.btn-add:disabled{background:#c4c0ef;cursor:default}
.add-form{background:#fff;border:1px solid #e8e8e5;border-radius:12px;padding:14px;margin-bottom:24px;display:flex;flex-direction:column;gap:10px}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-hint{font-size:11px;color:#bbb;line-height:1.55;margin:0}
.goal-row{display:flex;align-items:flex-start;gap:8px;background:#fff;border:1px solid #e8e8e5;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.drag-handle{cursor:grab;color:#ccc;font-size:16px;padding:2px 4px;user-select:none;touch-action:none;flex-shrink:0;margin-top:2px}
.drag-handle:active{cursor:grabbing}
.goal-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.goal-text{font-size:14px;color:#1a1a18}
.min-inp{border:none;border-bottom:1px solid #e8e8e5;outline:none;font-size:12px;color:#888;background:transparent;font-family:inherit;padding:3px 0;width:100%}
.min-inp::placeholder{color:#ccc}
.btn-del{background:none;border:none;cursor:pointer;font-size:13px;color:#e0a0a0;padding:2px 6px;border-radius:6px;transition:color .15s;flex-shrink:0}
.btn-del:hover{color:#dc2626;background:#fef2f2}
.empty-msg{text-align:center;color:#bbb;font-size:13px;padding:32px 0}
.drag-over{outline:2px solid #7F77DD;border-radius:12px}
</style>
</head>
<body>
<div class="app">
  <div class="top-nav">
    <span class="nav-title">今日の目標を管理</span>
    <a class="nav-link" href="/ui/reflections">← 振り返りに戻る</a>
  </div>
  <div class="add-form">
    <div class="field-group">
      <input class="txt-inp" id="new-goal" type="text" placeholder="今日の目標（例：瞑想を30分行う）">
      <p class="field-hint">科学的な研究では、曖昧な目標よりも「具体的で少し挑戦的な目標」の方が、達成率が劇的に高まることが証明されています。</p>
    </div>
    <div class="field-group">
      <input class="txt-inp" id="new-minimum" type="text" placeholder="ミニマム目標（任意）（例：キツい日は「1分だけ」でOK）">
      <p class="field-hint">どんなに小さくても「自分で決めた基準をクリアした」という事実が自己効力感を守り、挫折を防ぎます。</p>
    </div>
    <button class="btn-add" onclick="addGoal()">追加</button>
  </div>
  <div id="goalList"></div>
</div>

<script>
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function load(){
  const res = await fetch('/daily-goals');
  const data = await res.json();
  render(data.goals || []);
}

function render(goals){
  const el = document.getElementById('goalList');
  el.innerHTML = '';
  if(goals.length === 0){
    el.innerHTML = '<div class="empty-msg">目標がありません。上から追加してください。</div>';
    return;
  }
  goals.forEach(g => el.appendChild(buildRow(g)));
}

function buildRow(goal){
  const row = document.createElement('div');
  row.className = 'goal-row';
  row.dataset.id = goal.id;
  row.draggable = true;
  row.innerHTML = `
    <span class="drag-handle">≡</span>
    <div class="goal-body">
      <span class="goal-text">${escHtml(goal.content)}</span>
      <input class="min-inp" type="text" placeholder="ミニマム目標（任意）" value="${escHtml(goal.minimum_goal||'')}" onblur="saveMinimum(${goal.id}, this)">
    </div>
    <button class="btn-del" onclick="deleteGoal(${goal.id}, this)">✕</button>`;
  return row;
}

function makeSortable(container, itemSel, onReorder) {
  let dragging = null;
  let clone = null;
  let offsetX = 0, offsetY = 0;
  container.addEventListener('dragstart', e => {
    const el = e.target.closest(itemSel);
    if (!el || !container.contains(el)) return;
    dragging = el;
    setTimeout(() => { if(dragging) dragging.style.opacity = '0.3'; }, 0);
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
  });
  container.addEventListener('dragend', () => {
    if (dragging) { dragging.style.opacity = ''; dragging = null; }
  });
  container.addEventListener('dragover', e => {
    e.preventDefault(); e.stopPropagation();
    const target = e.target.closest(itemSel);
    if (!target || target === dragging || !container.contains(target)) return;
    const mid = target.getBoundingClientRect().top + target.getBoundingClientRect().height / 2;
    if (e.clientY > mid) target.after(dragging); else target.before(dragging);
  });
  container.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    const ids = [...container.querySelectorAll(itemSel)].map(el => parseInt(el.dataset.id));
    onReorder(ids);
  });
  container.addEventListener('touchstart', e => {
    const handle = e.target.closest('.drag-handle');
    if (!handle || !container.contains(handle)) return;
    const el = handle.closest(itemSel);
    if (!el) return;
    dragging = el;
    const touch = e.touches[0];
    const rect = el.getBoundingClientRect();
    offsetX = touch.clientX - rect.left;
    offsetY = touch.clientY - rect.top;
    clone = el.cloneNode(true);
    clone.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:0.85;pointer-events:none;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,.15);border-radius:12px`;
    document.body.appendChild(clone);
    el.style.opacity = '0.3';
    e.preventDefault();
  }, {passive:false});
  container.addEventListener('touchmove', e => {
    if (!dragging || !clone) return;
    const touch = e.touches[0];
    clone.style.left = (touch.clientX - offsetX) + 'px';
    clone.style.top  = (touch.clientY - offsetY) + 'px';
    const target = document.elementFromPoint(touch.clientX, touch.clientY)?.closest(itemSel);
    if (target && target !== dragging && container.contains(target)) {
      const mid = target.getBoundingClientRect().top + target.getBoundingClientRect().height / 2;
      if (touch.clientY > mid) target.after(dragging); else target.before(dragging);
    }
    e.preventDefault();
  }, {passive:false});
  container.addEventListener('touchend', () => {
    if (!dragging) return;
    if (clone) { clone.remove(); clone = null; }
    dragging.style.opacity = '';
    const ids = [...container.querySelectorAll(itemSel)].map(el => parseInt(el.dataset.id));
    onReorder(ids);
    dragging = null;
  });
}

async function addGoal(){
  const inp = document.getElementById('new-goal');
  const minInp = document.getElementById('new-minimum');
  const content = inp.value.trim();
  if(!content) return;
  const minimum_goal = minInp.value.trim() || null;
  const res = await fetch('/daily-goals', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({content, minimum_goal, sort_order: 0})
  });
  if(res.ok){ inp.value = ''; minInp.value = ''; load(); }
}

async function saveMinimum(goalId, inp){
  const minimum_goal = inp.value.trim() || null;
  await fetch('/daily-goals/'+goalId, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({minimum_goal})
  });
}

async function deleteGoal(id, btn){
  if(!confirm('この目標を削除しますか？')) return;
  btn.disabled = true;
  const res = await fetch('/daily-goals/'+id, {method:'DELETE'});
  if(res.ok) load();
  else btn.disabled = false;
}

document.getElementById('new-goal').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('new-minimum').focus();
});
document.getElementById('new-minimum').addEventListener('keydown', e => {
  if(e.key === 'Enter') addGoal();
});

load();
makeSortable(document.getElementById('goalList'), '.goal-row', async (ids) => {
  await fetch('/daily-goals/reorder', {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ids})
  });
});
</script>
</body>
</html>
